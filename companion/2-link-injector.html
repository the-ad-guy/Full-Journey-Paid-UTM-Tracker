<!--
  Link Injector — Tag 2 of 2 (GTM Custom HTML)
  ============================================
  Trigger: DOM Ready - All Pages.
  Pairs with Tag 1 (1-attribution-cookie.html, Initialization), which writes
  the state this tag reads.

  Use this when the destination of an outbound link is a system you cannot
  put GTM on - a CRM application, a third-party booking or checkout flow, a
  partner portal. Everything the destination needs must ride on the URL
  before the visitor leaves. The destination captures the inbound URL and
  parses the attribution out of it.

  ---------------------------------------------------------------------------
  CONFIGURE: set DESTINATION_HOSTS to the hostname(s) you want decorated.
  The tag does nothing until you do. Everything else is optional.
  ---------------------------------------------------------------------------

  What it does:
    - Reads the persisted attribution state (see Tag 1) plus the live Meta
      (_fbc/_fbp) and GA4 cookies.
    - Rebuilds the query string of every link whose parsed hostname EXACTLY
      matches a configured destination (never substring matching), preserving
      the path, hash, and any unmanaged existing parameters.
    - Decorates at DOM Ready, again on pointerdown/focusin (covers links
      added after load, middle-click, keyboard navigation), and one final
      synchronous pass on capture-phase click. Decoration is idempotent -
      every pass rebuilds the query from scratch in a fixed order, so
      repeated runs produce a byte-identical URL and can never create
      duplicates. Navigation is never delayed.

  Outbound order (each parameter omitted entirely when no valid value
  exists). Offline-conversion keys lead, so they survive if anything
  downstream truncates the captured URL:

     1. gclid                          Google Ads offline-conversion key
     2. fbc, fbp                       Meta Conversions API matching params.
                                       fbc is the FORMATTED click identifier
                                       (fb.1.<ts>.<fbclid>) - Meta does not
                                       accept a raw fbclid for uploads. fbp
                                       matches at browser level. Both are
                                       PAID-ATTRIBUTED VISITORS ONLY.
     3. gbraid, wbraid, msclkid,       each network's own conversion key
        ttclid, li_fat_id              (Google app/iOS, Microsoft, TikTok,
                                       LinkedIn). Latest value per type.
     4. utm_*                          every utm_* of first_paid_utm (first touch)
     5. recent_utm_*                   every utm_* of recent_paid_utm, prefixed
     6. paid_touch_count,              paid journey summary: raw touch count,
        utm_journey, first_paid_date   collapsed platform path, first-touch date
     7. traffic_channel,               overall site-entry channel, first + recent
        recent_traffic_channel
     8. nonpaid_channel,               nonpaid layer: channel + referrer domain,
        nonpaid_referrer_domain,       first + recent. Referrer params are
        recent_nonpaid_channel,        dropped on direct touches rather than
        recent_nonpaid_referrer_domain left paired with a newer touch.
     9. ga_client_id, ga_session_id,   GA4 IDs of the most recent PAID session
        ga_session_number
    10. fbclid                         raw click id, reference only - fbc
                                       supersedes it for uploads, so this is
                                       the first field worth losing
    11. (anything already on the link, re-appended in its original order)

  GA4 capture (no configuration needed):
    - The GA4 stream is auto-discovered from the _ga_XXXXXXX cookie name -
      the suffix IS the measurement ID minus "G-", so a cookie named
      _ga_ABC123DEF4 means the measurement ID is G-ABC123DEF4. If the site
      runs a second GA4 property, pin GA4_MEASUREMENT_ID below; with multiple
      _ga_* cookies and no override the session ID is deliberately skipped,
      because a wrong-property session ID would silently join to nothing.
    - Client ID parses from _ga; session ID/number parse from the stream
      cookie (both GS1 "GS1.1.<sid>.<sn>." and GS2 "GS2.1.s<sid>$o<sn>$"
      formats). A bounded gtag('get') refresh (dataLayer arguments shim -
      there is no global gtag() when GA4 loads via GTM) then overwrites the
      parsed values when it responds. Max 5 retries, 1s apart. GA4 IDs are
      captured only during PAID sessions and stored in attr_ga, so a later
      organic session never replaces the paid session's IDs.

  Hard rules:
    - fbc/fbp/ga_* are never sent for visitors without paid attribution,
      never fabricated (no _fbc synthesized from fbclid), never awaited at
      click time.
    - Each managed name is written at most once. Blank / null / undefined
      values are never injected.
    - A managed group is only rebuilt when we hold a value for it, so
      hardcoded params already on a link are not stripped from visitors with
      no attribution of that kind.
-->
<script>
(function () {
  'use strict';

  // ================================ CONFIG ================================
  var DEBUG = false;                 // true = verbose console logging

  // REQUIRED. Exact hostnames to decorate. The tag is inert until set.
  // e.g. ['app.example.com', 'booking.example.net']
  var DESTINATION_HOSTS = [];

  var GA4_MEASUREMENT_ID = '';       // OPTIONAL override, e.g. 'G-ABC123DEF4'.
                                     // Leave blank: auto-discovered from the _ga_* cookie.
                                     // REQUIRED only if the site runs 2+ GA4 properties.

  // '' = auto-detect (must match Tag 1's behavior). Or hard-code '.example.com'.
  var COOKIE_DOMAIN = '';

  var GA_COOKIE_TTL_MS = 730 * 864e5;
  var GA_RETRY_MAX = 5;
  var GA_RETRY_MS = 1000;

  // KEEP IN SYNC with CLICK_IDS in Tag 1.
  var CLICK_IDS = ['gclid', 'gbraid', 'wbraid', 'fbclid', 'msclkid', 'ttclid', 'li_fat_id'];

  var ATTR_COOKIE = 'attr_state';
  var SESS_COOKIE = 'attr_sess';
  var GA_COOKIE = 'attr_ga';
  var FIRST_PAID_COOKIE = 'first_paid_utm';
  var RECENT_PAID_COOKIE = 'recent_paid_utm';
  // ========================================================================

  function log() {
    if (DEBUG && window.console && window.console.log) {
      var args = ['[UTM-TRACKER:T2]'];
      for (var i = 0; i < arguments.length; i++) args.push(arguments[i]);
      window.console.log.apply(window.console, args);
    }
  }

  // Normalize configured hosts once.
  var hosts = [];
  for (var h = 0; h < DESTINATION_HOSTS.length; h++) {
    var hv = String(DESTINATION_HOSTS[h] || '').toLowerCase().replace(/^\s+|\s+$/g, '');
    if (hv) hosts.push(hv);
  }
  if (!hosts.length) {
    log('DESTINATION_HOSTS is empty - set it to the hostname(s) you want decorated.');
    return;
  }

  // ----------------------------- cookie utils -----------------------------

  function getCookie(name) {
    var parts = String(document.cookie || '').split(';');
    for (var i = 0; i < parts.length; i++) {
      var c = parts[i];
      while (c.charAt(0) === ' ') c = c.substring(1);
      if (c.indexOf(name + '=') === 0) {
        var raw = c.substring(name.length + 1);
        try { return decodeURIComponent(raw); } catch (e) { return raw; }
      }
    }
    return null;
  }

  function cookieNames() {
    var out = [];
    var parts = String(document.cookie || '').split(';');
    for (var i = 0; i < parts.length; i++) {
      var c = parts[i];
      while (c.charAt(0) === ' ') c = c.substring(1);
      var eq = c.indexOf('=');
      if (eq > 0) out.push(c.substring(0, eq));
    }
    return out;
  }

  // Same probe used by Tag 1, so both tags agree on the cookie domain.
  function resolveCookieDomain() {
    var host = String(window.location.hostname || '').toLowerCase();
    if (!host || host.indexOf('.') === -1 || /^[\d.]+$/.test(host)) return '';
    var parts = host.split('.');
    var probe = '_attr_probe2';
    for (var i = parts.length - 2; i >= 0; i--) {
      var candidate = '.' + parts.slice(i).join('.');
      try {
        document.cookie = probe + '=1; domain=' + candidate + '; path=/; SameSite=Lax';
        if (document.cookie.indexOf(probe + '=1') !== -1) {
          document.cookie = probe + '=; domain=' + candidate +
            '; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
          return candidate;
        }
      } catch (e) { /* try the next narrower candidate */ }
    }
    return '';
  }

  var cookieDomain = COOKIE_DOMAIN || resolveCookieDomain();

  function readJsonCookie(name) {
    var raw = getCookie(name);
    if (!raw) return null;
    try {
      var obj = JSON.parse(raw);
      return (obj && typeof obj === 'object') ? obj : null;
    } catch (e) { return null; }
  }

  function writeJsonCookie(name, obj, ttlMs) {
    try {
      var d = new Date();
      d.setTime(d.getTime() + ttlMs);
      document.cookie = name + '=' + encodeURIComponent(JSON.stringify(obj)) +
        '; expires=' + d.toUTCString() +
        (cookieDomain ? '; domain=' + cookieDomain : '') +
        '; path=/; SameSite=Lax; Secure';
    } catch (e) { log('cookie write failed', name, e); }
  }

  // ------------------------------ value utils -----------------------------

  function isValidValue(v) {
    if (v === null || v === undefined) return false;
    var s = String(v).replace(/^\s+|\s+$/g, '');
    if (s === '') return false;
    var lower = s.toLowerCase();
    return lower !== 'null' && lower !== 'undefined';
  }

  // Click IDs in OUTPUT order: gclid leads, the rest keep their configured
  // order. Detection and storage order are unchanged - this only affects
  // where they land in the query string. gclid and fbclid are positioned
  // explicitly by buildHref; this supplies the order of everything between.
  function orderedClickIds() {
    var out = ['gclid'], i;
    if (CLICK_IDS.indexOf('gclid') === -1) out = [];
    for (i = 0; i < CLICK_IDS.length; i++) {
      if (out.indexOf(CLICK_IDS[i]) === -1) out.push(CLICK_IDS[i]);
    }
    return out;
  }

  // Epoch ms -> YYYY-MM-DD (UTC). Returns null for anything unparseable, so
  // a corrupted value omits the parameter rather than emitting Invalid Date.
  function formatUtcDate(ms) {
    var n = Number(ms);
    if (!n || !isFinite(n) || n <= 0) return null;
    var d = new Date(n);
    if (isNaN(d.getTime())) return null;
    var mo = d.getUTCMonth() + 1, day = d.getUTCDate();
    return d.getUTCFullYear() + '-' + (mo < 10 ? '0' : '') + mo + '-' + (day < 10 ? '0' : '') + day;
  }

  // All utm_* params of a stored landing URL, as [[name, value], ...].
  function utmParamsFromURL(storedUrl) {
    var out = [];
    try {
      new URL(storedUrl).searchParams.forEach(function (v, k) {
        if (k.toLowerCase().indexOf('utm_') === 0 && isValidValue(v)) out.push([k, v]);
      });
    } catch (e) { log('stored paid URL unparseable, skipped'); }
    return out;
  }

  // ------------------------------ state read ------------------------------

  function readState() {
    var s = {};
    s.firstPaid = getCookie(FIRST_PAID_COOKIE);
    s.recentPaid = getCookie(RECENT_PAID_COOKIE);
    var attr = readJsonCookie(ATTR_COOKIE) || {};
    s.ftc = attr.ftc; s.rtc = attr.rtc;
    s.fnc = attr.fnc; s.fnr = attr.fnr;
    s.rnc = attr.rnc; s.rnr = attr.rnr;
    s.ids = (attr.ids && typeof attr.ids === 'object') ? attr.ids : {};
    s.ptc = attr.ptc; s.psp = attr.psp; s.fpd = attr.fpd;
    var sess = readJsonCookie(SESS_COOKIE);
    s.paidSession = !!(sess && sess.ch === 'paid');

    var anyId = false;
    for (var i = 0; i < CLICK_IDS.length; i++) {
      if (isValidValue(s.ids[CLICK_IDS[i]])) { anyId = true; break; }
    }
    s.anyId = anyId;
    // "Has paid attribution" gates Meta + GA identifiers.
    s.hasPaid = !!(s.firstPaid || s.recentPaid || anyId || s.paidSession);

    // Live Meta cookies, read fresh on every pass; freshest value wins.
    s.fbc = s.hasPaid ? getCookie('_fbc') : null;
    s.fbp = s.hasPaid ? getCookie('_fbp') : null;

    s.ga = s.hasPaid ? (readJsonCookie(GA_COOKIE) || null) : null;
    return s;
  }

  // --------------------------- URL construction ---------------------------

  function isDestination(hostname) {
    var hn = String(hostname || '').toLowerCase();
    for (var i = 0; i < hosts.length; i++) if (hn === hosts[i]) return true;
    return false;
  }

  // The query string is REBUILT rather than patched. Patching cannot control
  // global order, because parameters already on the link keep their original
  // positions - so attribution would land wherever the author happened to
  // leave a gap. Rebuilding emits the managed groups in a fixed order and
  // re-appends everything else at the tail.
  //
  // Order matters because the highest-value fields should survive if anything
  // downstream truncates the captured URL: click IDs first (offline
  // conversion uploads need them), then the paid UTMs.
  function buildHref(href, s) {
    var u;
    try { u = new URL(href, window.location.href); } catch (e) { return null; }
    if (!isDestination(u.hostname)) return null;
    var i;

    // Snapshot what is already on the link, in its original order.
    var existing = [];
    u.searchParams.forEach(function (v, k) { existing.push([k, v]); });

    var out = [];      // managed pairs, in canonical order
    var owned = {};    // lowercase names this pass controls

    function own(name) { owned[String(name).toLowerCase()] = true; }

    // Claims the name and emits it, but only when the value is real. A name
    // is claimed only when we hold a value for it, so params hardcoded on the
    // link survive for visitors with no attribution of that kind. Last write
    // wins while keeping the first position, so no duplicates can appear.
    function put(name, value) {
      if (!isValidValue(value)) return;
      var lk = String(name).toLowerCase();
      var v = String(value).replace(/^\s+|\s+$/g, '');
      owned[lk] = true;
      for (var j = 0; j < out.length; j++) {
        if (out[j][0].toLowerCase() === lk) { out[j][1] = v; return; }
      }
      out.push([name, v]);
    }

    var firstUtms = s.firstPaid ? utmParamsFromURL(s.firstPaid) : [];
    var recentUtms = s.recentPaid ? utmParamsFromURL(s.recentPaid) : [];

    var ids = orderedClickIds();

    // 1. Google Ads click identifier - the key for offline conversion imports.
    if (s.anyId) put('gclid', s.ids.gclid);

    // 2. Meta matching parameters. The Conversions API wants fbc, which is
    //    the FORMATTED click identifier (fb.1.<ts>.<fbclid>); it does not
    //    accept a raw fbclid. fbp is the second matching signal, and matches
    //    browser-level even when no click identifier survived.
    if (s.hasPaid) { put('fbc', s.fbc); put('fbp', s.fbp); }

    // 3. Remaining platform click identifiers - each is its own network's
    //    offline-conversion key (gbraid/wbraid for Google iOS and app
    //    campaigns, msclkid for Microsoft, ttclid for TikTok, li_fat_id for
    //    LinkedIn). Raw fbclid is deliberately excluded: fbc supersedes it,
    //    and it is emitted last for reference only.
    if (s.anyId) {
      for (i = 0; i < ids.length; i++) {
        if (ids[i] === 'gclid' || ids[i] === 'fbclid') continue;
        put(ids[i], s.ids[ids[i]]);
      }
    }

    // 4. First paid touch -> utm_* (generic passthrough).
    for (i = 0; i < firstUtms.length; i++) put(firstUtms[i][0], firstUtms[i][1]);

    // 5. Most recent paid touch -> recent_utm_*.
    for (i = 0; i < recentUtms.length; i++) put('recent_' + recentUtms[i][0], recentUtms[i][1]);

    // 4. Paid journey summary.
    put('paid_touch_count', s.ptc);
    put('utm_journey', s.psp);
    put('first_paid_date', formatUtcDate(s.fpd));

    // 5. Overall traffic channel.
    put('traffic_channel', s.ftc);
    put('recent_traffic_channel', s.rtc);

    // 6. Nonpaid attribution. The referrer slot is claimed alongside its
    //    channel even when empty, so a direct touch drops the older domain
    //    instead of leaving it paired with the newer touch.
    if (isValidValue(s.fnc)) {
      put('nonpaid_channel', s.fnc);
      own('nonpaid_referrer_domain');
      put('nonpaid_referrer_domain', s.fnr);
    }
    if (isValidValue(s.rnc)) {
      put('recent_nonpaid_channel', s.rnc);
      own('recent_nonpaid_referrer_domain');
      put('recent_nonpaid_referrer_domain', s.rnr);
    }

    // 9. GA4 identifiers of the most recent paid session.
    if (s.hasPaid && s.ga) {
      put('ga_client_id', s.ga.cid);
      put('ga_session_id', s.ga.sid);
      put('ga_session_number', s.ga.sn);
    }

    // 10. Raw fbclid, last of the managed set. fbc already contains it in the
    //     form Meta accepts, so this is reference data rather than an upload
    //     key - it is the first thing worth losing to truncation.
    if (s.anyId) put('fbclid', s.ids.fbclid);

    // 9. Everything we do not manage, in its original relative order. A whole
    //    prefix group is dropped only when we rebuilt it from stored state.
    var dropUtm = firstUtms.length > 0;
    var dropRecentUtm = recentUtms.length > 0;
    var survivors = [];
    for (i = 0; i < existing.length; i++) {
      var lk = existing[i][0].toLowerCase();
      if (owned[lk]) continue;
      if (dropRecentUtm && lk.indexOf('recent_utm_') === 0) continue;
      if (dropUtm && lk.indexOf('utm_') === 0) continue;
      if (s.anyId && ids.indexOf(lk) !== -1) continue;
      survivors.push(existing[i]);
    }

    u.search = '';
    for (i = 0; i < out.length; i++) u.searchParams.append(out[i][0], out[i][1]);
    // append (not set) so genuine duplicates of unmanaged keys are preserved
    for (i = 0; i < survivors.length; i++) u.searchParams.append(survivors[i][0], survivors[i][1]);

    return u.toString();
  }

  function decorateAnchor(a, s) {
    if (!a || !a.getAttribute) return;
    var href = a.getAttribute('href');
    if (!href) return;
    var out = buildHref(href, s); // does the exact hostname check
    if (out && out !== href) {
      a.setAttribute('href', out);
      log('link decorated:', out);
    }
  }

  function decorateAll() {
    try {
      var s = readState();
      var sel = [];
      for (var i = 0; i < hosts.length; i++) sel.push('a[href*="' + hosts[i] + '"]');
      var links = document.querySelectorAll(sel.join(','));
      for (var j = 0; j < links.length; j++) decorateAnchor(links[j], s);
    } catch (e) { log('decorateAll failed (suppressed)', e); }
  }

  // ------------------------------ GA4 capture -----------------------------

  // Returns { mid, suffix } | { ambiguous: true } | null.
  function resolveGaStream() {
    if (GA4_MEASUREMENT_ID) {
      return { mid: GA4_MEASUREMENT_ID, suffix: GA4_MEASUREMENT_ID.replace(/^G-/, '') };
    }
    var names = cookieNames();
    var suffixes = [];
    for (var i = 0; i < names.length; i++) {
      var m = names[i].match(/^_ga_([A-Z0-9]+)$/);
      if (m && suffixes.indexOf(m[1]) === -1) suffixes.push(m[1]);
    }
    if (suffixes.length === 1) return { mid: 'G-' + suffixes[0], suffix: suffixes[0] };
    if (suffixes.length > 1) {
      log('MULTIPLE GA4 streams found (' + suffixes.join(', ') + ') - session ID skipped. Pin GA4_MEASUREMENT_ID to fix.');
      return { ambiguous: true };
    }
    return null;
  }

  function parseGaCookies() {
    var out = {};
    var ga = getCookie('_ga'); // e.g. GA1.1.1234567890.1699999999 -> client id 1234567890.1699999999
    if (ga) {
      var parts = ga.split('.');
      if (parts.length >= 4) out.cid = parts.slice(2).join('.');
    }
    var stream = resolveGaStream();
    if (stream && stream.suffix) {
      var sc = getCookie('_ga_' + stream.suffix);
      if (sc) {
        // GS1.1.<sid>.<sn>....  or  GS2.1.s<sid>$o<sn>$g...
        var m = sc.match(/^GS\d+\.\d+\.s?(\d+)(?:[.$]o?(\d+))?/);
        if (m) {
          out.sid = m[1];
          if (m[2]) out.sn = m[2];
        }
      }
    }
    return out;
  }

  function isPaidSession() {
    var sess = readJsonCookie(SESS_COOKIE);
    return !!(sess && sess.ch === 'paid');
  }

  // Merge freshly captured values into attr_ga. Existing values survive when
  // a newer capture lacks them ("most recent successfully captured" rule).
  function storeGa(values) {
    if (!values || (!values.cid && !values.sid && !values.sn)) return;
    var cur = readJsonCookie(GA_COOKIE) || {};
    var next = {
      v: 1,
      cid: values.cid || cur.cid,
      sid: values.sid || cur.sid,
      sn: values.sn || cur.sn
    };
    if (!next.cid) delete next.cid;
    if (!next.sid) delete next.sid;
    if (!next.sn) delete next.sn;
    writeJsonCookie(GA_COOKIE, next, GA_COOKIE_TTL_MS);
    log('paid GA session stored', next);
  }

  var gaRetries = 0;
  var gaGotSession = false;

  // gtag('get') via the dataLayer arguments shim. When GA4 loads through GTM
  // there is no global gtag(); pushing an arguments object onto dataLayer
  // reaches the same command queue. Callbacks may fire late (the queue is
  // processed when gtag.js loads) - storeGa handles whenever.
  function attemptGtagGet() {
    try {
      if (!isPaidSession()) return;
      var stream = resolveGaStream();
      if (!stream || stream.ambiguous || !stream.mid) return;
      if (!window.dataLayer || typeof window.dataLayer.push !== 'function') return;
      var gtag = function () { window.dataLayer.push(arguments); };
      gtag('get', stream.mid, 'client_id', function (v) {
        if (v) { storeGa({ cid: String(v) }); log('GA client ID captured (gtag)'); }
      });
      gtag('get', stream.mid, 'session_id', function (v) {
        if (v) { gaGotSession = true; storeGa({ sid: String(v) }); log('GA paid session ID captured (gtag)'); }
      });
    } catch (e) { log('gtag get failed (suppressed)', e); }
  }

  function scheduleGaRetry() {
    if (gaGotSession || gaRetries >= GA_RETRY_MAX) return;
    gaRetries++;
    window.setTimeout(function () {
      if (gaGotSession) return;
      attemptGtagGet();
      scheduleGaRetry();
    }, GA_RETRY_MS);
  }

  function captureGa() {
    try {
      if (!isPaidSession()) return; // GA IDs represent the most recent PAID visit only
      storeGa(parseGaCookies());    // synchronous primary - no waiting
      attemptGtagGet();             // async, supported-API refresh
      scheduleGaRetry();            // bounded; never blocks anything
    } catch (e) { log('GA capture failed (suppressed)', e); }
  }

  // ------------------------------- wiring ---------------------------------

  function onInteract(e) {
    try {
      var t = e.target;
      var a = (t && t.closest) ? t.closest('a') : null;
      if (!a) return;
      var s = readState();
      decorateAnchor(a, s);
      // Non-blocking refresh: benefits the next pass; the click never waits.
      if (e.type === 'pointerdown') attemptGtagGet();
    } catch (err) { log('interaction pass failed (suppressed)', err); }
  }

  try {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () {
        decorateAll();
        captureGa();
      });
    } else {
      decorateAll();
      captureGa();
    }

    // Delegated: covers links added after load (e.g. buttons revealed after a
    // form submit). pointerdown fires for every button incl. middle-click
    // (which never produces 'click'); focusin covers keyboard users; the
    // capture-phase click is the final synchronous pass before navigation.
    document.addEventListener('pointerdown', onInteract, true);
    document.addEventListener('focusin', onInteract, true);
    document.addEventListener('click', onInteract, true);
  } catch (err) {
    log('fatal (suppressed)', err);
  }
})();
</script>
